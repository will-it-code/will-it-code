<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:system-ui,sans-serif}
.calc{background:#1e293b;padding:28px;border-radius:24px;width:340px;box-shadow:0 20px 60px #0008}
#d{background:#0b1220;color:#4ade80;font-size:64px;text-align:right;padding:18px;border-radius:14px;margin-bottom:18px;min-height:84px;overflow:hidden;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{font-size:30px;padding:20px;border:0;border-radius:14px;background:#334155;color:#fff;cursor:pointer}
button.op{background:#f59e0b}button.eq{background:#22c55e}
h1{color:#94a3b8;font-size:22px;text-align:center;margin:0 0 14px;font-weight:600}
</style></head><body><div><h1>15-LINE CALCULATOR</h1><div class="calc"><div id="d">0</div><div class="grid" id="g"></div></div></div>
<script>
const d=document.getElementById('d'),g=document.getElementById('g');
let e='';
'789/456*123-0.C+='.split('').forEach(k=>{
const b=document.createElement('button');
b.textContent=k;
b.className='/*-+'.includes(k)?'op':(k==='=')?'eq':'';
b.onclick=()=>press(k);
g.appendChild(b);
});
function press(k){
if(k==='C'){e='';d.textContent='0';return;}
if(k==='='){try{e=String(eval(e));d.textContent=e}catch{d.textContent='Err'}return;}
e+=k;d.textContent=e;
}
</script></body></html>
