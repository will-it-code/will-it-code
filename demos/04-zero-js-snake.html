<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will it code? Ep 4 — Snake, zero JavaScript</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b1220; color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 40px 20px; min-height: 100vh;
  }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: #4ade80; }
  .sub { color: #94a3b8; font-size: 15px; }
  .arena {
    position: relative; width: 380px; height: 380px;
    background: #0f172a; border: 2px solid #1e293b; border-radius: 12px;
    overflow: hidden;
  }
  /* The "snake": a keyframe-animated trail that moves on a fixed loop */
  .snake {
    position: absolute; width: 280px; height: 14px;
    background: linear-gradient(90deg, #22c55e, #86efac);
    border-radius: 7px; left: 50px; top: 180px;
    animation: patrol 6s linear infinite;
  }
  .snake::after { /* head */
    content: ""; position: absolute; right: -8px; top: -3px;
    width: 20px; height: 20px; background: #4ade80; border-radius: 6px;
  }
  @keyframes patrol {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(0, -150px); }
    50%  { transform: translate(60px, -150px); }
    75%  { transform: translate(60px, 150px); }
    100% { transform: translate(0, 0); }
  }
  .food {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: #f87171; left: 170px; top: 30px;
    box-shadow: 0 0 12px #f87171;
  }
  .hint {
    background: #1e293b; border: 1px solid #334155; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; color: #cbd5e1;
  }
  kbd {
    background: #0f172a; border: 1px solid #475569; border-bottom-width: 3px;
    border-radius: 6px; padding: 2px 8px; font-family: monospace; font-size: 13px;
  }
  .verdict {
    margin-top: 6px; font-size: 15px; color: #fca5a5; font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Snake game. <span>Zero JavaScript.</span></h1>
  <div class="sub">Will it code? Episode 4 — the honest attempt</div>
  <div class="arena">
    <div class="food"></div>
    <div class="snake"></div>
  </div>
  <div class="hint">Try pressing <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> … nothing happens.</div>
  <div class="verdict">CSS can animate the snake. It cannot read your keys. IT FAILED</div>
</body>
</html>
